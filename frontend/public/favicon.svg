<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background pill -->
  <rect width="32" height="32" rx="8" fill="#16130f"/>
  <!-- Hammer head -->
  <rect x="7" y="8" width="14" height="8" rx="2" fill="#e8c58a"/>
  <!-- Hammer handle -->
  <rect x="16" y="14" width="4" height="12" rx="1.5" transform="rotate(-35 16 14)" fill="#c8a870"/>
  <!-- Highlight on hammer head -->
  <rect x="7" y="8" width="14" height="3" rx="2" fill="#f2d9a8" opacity="0.5"/>
</svg>
